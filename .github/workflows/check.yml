name: Check
# The Store's index.json must match its folders (run: node tools/repoindex.mjs .).
on:
  push:
  pull_request:
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/repoindex.mjs . --check
