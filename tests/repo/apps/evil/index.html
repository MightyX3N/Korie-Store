<!doctype html>
<html><body>
<pre id="out"></pre>
<script src="/__pbs/sdk.js"></script>
<script>
  const out = {};
  const done = () => { document.getElementById('out').textContent = JSON.stringify(out); };
  (async () => {
    out.native = typeof window.PBSNative;
    try { out.parentDoc = !!window.parent.document; } catch (e) { out.parentDoc = 'blocked'; }
    try { out.parentStorage = window.parent.localStorage.getItem('pbs-settings'); } catch (e) { out.parentStorage = 'blocked'; }
    out.otherAppsNote = await pbs.storage.get('note'); // the Notes app's key, in our own space
    // A frame inside this app (not registered with the launcher) asks for things: no answer.
    const f = document.createElement('iframe');
    f.srcdoc = '<script>window.top.postMessage({__pbs:1,id:99,method:"storage.get",args:{key:"note"}},"*");<\/script>';
    let answered = false;
    window.addEventListener('message', (e) => { if (e.data && e.data.id === 99) answered = true; });
    document.body.append(f);
    await new Promise((r) => setTimeout(r, 800));
    out.innerFrameAnswered = answered;
    // Reaching the launcher's page from here.
    try { const r = await fetch('http://localhost:8600/index.html'); out.fetchLauncher = r.status; } catch (e) { out.fetchLauncher = 'blocked'; }
    done();
  })();
</script>
</body></html>
