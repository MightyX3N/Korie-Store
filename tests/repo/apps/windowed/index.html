<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/__pbs/pbs.css"></head>
<body style="padding:2rem">
  <h1 id="title">Notes</h1>
  <p id="open"></p>
  <input class="pbs-input" id="note" data-pbs-autofocus>
  <div style="margin-top:1rem;display:flex;gap:1rem">
    <button class="pbs-btn" id="save">Save</button>
    <button class="pbs-btn" id="sub">Open a page</button>
    <button class="pbs-btn" id="play">Play a video</button>
  </div>
  <p id="out"></p>
  <div id="panel" hidden><button class="pbs-btn" id="inner">Inside a panel</button></div>
<script src="/__pbs/sdk.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  if (pbs.mode === 'service') {
    pbs.provide('rows', async () => [{ id: 'notes', title: 'Your notes', shape: 'square', items: [{ id: 'n1', title: (await pbs.storage.get('note')) || 'First note', subtitle: 'A note', image: '' }] }]);
    pbs.provide('search', async ({ query }) => query.toLowerCase().includes('note') ? [{ id: 'n1', title: 'Note about ' + query, image: '' }] : []);
  } else {
    pbs.ready.then(async (info) => {
      $('open').textContent = 'open=' + (pbs.open || '') + ' platform=' + info.platform;
      $('note').value = (await pbs.storage.get('note')) || '';
      pbs.setTitle('Notes · ' + (pbs.open || 'all'));
    });
    $('save').onclick = async () => { await pbs.storage.set('note', $('note').value); await pbs.refreshRows(); $('out').textContent = 'saved'; };
    $('sub').onclick = async () => { const r = await pbs.openWeb('http://localhost:8611/apps/windowed/icon.svg'); $('out').textContent = 'web closed ' + JSON.stringify(r); };
    $('play').onclick = async () => { const r = await pbs.play({ url: 'http://localhost:8611/none.mp4', title: 'Clip' }); $('out').textContent = 'played ' + JSON.stringify(r); };
    // Back closes the panel first, then the app.
    $('note').addEventListener('keydown', (e) => { if (e.key === 'F2') { $('panel').hidden = false; $('inner').focus(); } });
    pbs.onBack(() => { if (!$('panel').hidden) { $('panel').hidden = true; $('out').textContent = 'panel closed'; return true; } return false; });
  }
</script>
</body></html>
